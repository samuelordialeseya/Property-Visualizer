<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Property Visualizer — 30s Motion Graphics Showreel (1920x1080)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05080c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: 'Sora', sans-serif;
    }
    canvas {
      width: 1920px;
      height: 1080px;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });

    // ── Official DESIGN.md Tokens ──────────────────────────────────────────
    const COLORS = {
      oceanAuthority: '#0b3860',
      blueprintCobalt: '#2270b8',
      midnightNavy: '#051b30',
      iceTint: '#e1ebf4',
      skyFocus: '#479de9',
      brandEmerald: '#2d8a5e',
      surfaceCanvas: '#f4f4f5',
      surfaceCard: '#ffffff',
      textCharcoal: '#18181b',
      textMuted: '#71717a',
      borderLight: '#e4e4e7',
      obsidianDark: '#0b0f13',
      obsidianSurface: '#141a21',
      obsidianBorder: '#262f38',
      occupied: '#d98a53',
      occupiedTint: '#fef3c7',
      occupiedText: '#92400e',
      overdue: '#e05c5c',
      overdueTint: '#fee2e2',
      overdueText: '#991b1b',
      vacant: '#6e8592',
      vacantTint: '#f4f4f5',
      vacantText: '#52525b'
    };

    // 128.0 BPM => 1 beat = 0.46875s, 1 bar = 1.875s, 16 bars = 30.000s
    const BPM = 128.0;
    const BEAT = 60.0 / BPM; // 0.46875s
    const BAR = BEAT * 4;    // 1.875s

    // ── Real Project Assets ────────────────────────────────────────────────
    const assetSources = {
      icon: 'assets/building-icon.png',
      faviconHires: 'assets/favicon-hires.png',
      logoHorizontal: 'assets/logo-horizontal.png',
      logoFull: 'assets/logo-full.png',
      monogram: 'assets/logo-monogram.png',
      dashboard: 'assets/showreel_screen_01_dashboard.png',
      propDetail: 'assets/showreel_screen_02_property_detail.png',
      spatial3d: 'assets/showreel_screen_04_3d_spatial.png',
      cinematic3d: 'assets/showreel_3d_angle_cinematic.png',
      front3d: 'assets/showreel_3d_angle_front.png',
      top3d: 'assets/showreel_3d_angle_top.png',
      f1_3d: 'assets/showreel_screen_06_3d_f1.png',
      blueprintF1: 'assets/showreel_screen_05_2d_blueprint_f1.png',
      blueprintAll: 'assets/showreel_screen_05_2d_blueprint.png',
      unitsDir: 'assets/showreel_screen_07_units_directory.png',
      unitModal: 'assets/showreel_screen_08_unit_modal.png',
      maintenance: 'assets/showreel_screen_09_maintenance_list.png',
      staff: 'assets/showreel_screen_10_staff.png'
    };

    const images = {};

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = (e) => {
          console.warn('Failed to load:', src, e);
          resolve(null);
        };
        img.src = src;
      });
    }

    // Flood-fill outer white/near-white background pixels so mascot & monogram have zero white fringe on dark canvases
    function cleanOuterWhiteFringe(img) {
      if (!img) return null;
      const off = document.createElement('canvas');
      off.width = img.width;
      off.height = img.height;
      const octx = off.getContext('2d');
      octx.drawImage(img, 0, 0);
      const imgData = octx.getImageData(0, 0, off.width, off.height);
      const d = imgData.data;
      const w = off.width, h = off.height;
      const visited = new Uint8Array(w * h);
      const queue = [];

      const isBg = (idx) => {
        const r = d[idx], g = d[idx + 1], b = d[idx + 2], a = d[idx + 3];
        if (a < 25) return true;
        return (r > 215 && g > 215 && b > 215 && Math.abs(r - g) < 18 && Math.abs(g - b) < 18);
      };

      // Seed from all 4 borders
      for (let x = 0; x < w; x++) {
        queue.push(x);
        queue.push((h - 1) * w + x);
      }
      for (let y = 0; y < h; y++) {
        queue.push(y * w);
        queue.push(y * w + (w - 1));
      }

      while (queue.length > 0) {
        const p = queue.pop();
        if (visited[p]) continue;
        visited[p] = 1;
        const idx = p * 4;
        if (isBg(idx)) {
          d[idx + 3] = 0;
          const x = p % w, y = (p / w) | 0;
          if (x > 0 && !visited[p - 1]) queue.push(p - 1);
          if (x < w - 1 && !visited[p + 1]) queue.push(p + 1);
          if (y > 0 && !visited[p - w]) queue.push(p - w);
          if (y < h - 1 && !visited[p + w]) queue.push(p + w);
        }
      }

      // Soften 1px boundary alpha to eliminate any remaining halo
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const p = y * w + x;
          const idx = p * 4;
          if (d[idx + 3] > 0) {
            const neighbors = [p - 1, p + 1, p - w, p + w];
            let zeroNeighbors = 0;
            for (const n of neighbors) {
              if (d[n * 4 + 3] === 0) zeroNeighbors++;
            }
            if (zeroNeighbors > 0 && d[idx] > 185 && d[idx + 1] > 185 && d[idx + 2] > 185) {
              d[idx + 3] = 0;
            }
          }
        }
      }

      octx.putImageData(imgData, 0, 0);
      return off;
    }

    let preloadDone = false;
    async function preloadAll() {
      if (preloadDone) return;
      try {
        await Promise.all([
          document.fonts.load('800 72px Sora'),
          document.fonts.load('700 48px Sora'),
          document.fonts.load('800 18px Manrope'),
          document.fonts.load('600 14px Manrope'),
          document.fonts.load('700 14px "JetBrains Mono"')
        ]);
        await document.fonts.ready;
      } catch (e) {
        console.warn('Font preload notice:', e);
      }
      for (const [key, src] of Object.entries(assetSources)) {
        images[key] = await loadImage(src);
      }
      images.iconClean = cleanOuterWhiteFringe(images.icon);
      images.monogramClean = cleanOuterWhiteFringe(images.monogram);
      preloadDone = true;
      console.log('All 18 real Property Visualizer assets & fonts preloaded and alpha-cleaned!');
    }

    // ── Precision Easing Functions (Emil Kowalski / Apple Spring Vocabulary) ──
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInCubic(t) { return t * t * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
    function easeOutExpo(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
    function easeOutBack(t, overshoot = 1.65) {
      const c3 = overshoot + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + overshoot * Math.pow(t - 1, 2);
    }
    function easeOutSpring(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      return 1 - Math.exp(-6.5 * t) * Math.cos(10 * t);
    }

    // ── Deterministic Particle Field ───────────────────────────────────────
    const particles = Array.from({ length: 90 }, (_, i) => ({
      x: ((i * 137.5) % 1920),
      y: ((i * 293.7) % 1080),
      r: (i % 3) * 0.9 + 1.0,
      vx: ((i % 7) - 3) * 14,
      vy: -((i % 5) + 1) * 22,
      alpha: ((i % 5) + 2) * 0.11,
      color: i % 4 === 0 ? COLORS.occupied : (i % 3 === 0 ? COLORS.skyFocus : COLORS.blueprintCobalt)
    }));

    function drawParticles(t, opacityScale = 1.0) {
      ctx.save();
      for (const p of particles) {
        const px = ((p.x + p.vx * t + Math.sin(t * 2 + p.r) * 18) % 1920 + 1920) % 1920;
        const py = ((p.y + p.vy * t) % 1080 + 1080) % 1080;
        ctx.globalAlpha = p.alpha * opacityScale;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // ── Architectural Drafting Grid ────────────────────────────────────────
    function drawArchitecturalGrid(t, isLight = false, alpha = 0.15, speed = 1.0) {
      ctx.save();
      const gridSize = 60;
      const ox = (t * 24 * speed) % gridSize;
      const oy = (t * 16 * speed) % gridSize;

      ctx.strokeStyle = isLight
        ? `rgba(11, 56, 96, ${alpha * 0.55})`
        : `rgba(34, 112, 184, ${alpha})`;
      ctx.lineWidth = 1;

      for (let x = -gridSize; x <= 1920 + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x + ox, 0);
        ctx.lineTo(x + ox, 1080);
        ctx.stroke();
      }
      for (let y = -gridSize; y <= 1080 + gridSize; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y + oy);
        ctx.lineTo(1920, y + oy);
        ctx.stroke();
      }

      // Precision CAD crosshairs at 180px intervals
      ctx.strokeStyle = isLight
        ? `rgba(34, 112, 184, ${alpha * 1.2})`
        : `rgba(71, 157, 233, ${alpha * 1.9})`;
      ctx.lineWidth = 1.2;
      for (let x = 120; x < 1920; x += 180) {
        for (let y = 120; y < 1080; y += 180) {
          ctx.beginPath();
          ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y);
          ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // ── Framed App Screen Helper with Specular Bezel & Shadow ──────────────
    function drawFramedScreen(img, x, y, w, h, opts = {}) {
      if (!img) return;
      const {
        radius = 18,
        scale = 1,
        rot = 0,
        alpha = 1,
        borderColor = 'rgba(255,255,255,0.85)',
        shadowColor = 'rgba(5, 27, 48, 0.28)',
        shadowBlur = 55,
        shadowY = 26,
        topBar = false,
        highlightColor = null
      } = opts;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      if (rot !== 0) ctx.rotate(rot);
      if (scale !== 1) ctx.scale(scale, scale);

      // Outer ambient elevation shadow
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlur;
      ctx.shadowOffsetY = shadowY;

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, radius);
      ctx.fill();

      // Clip inside rounded rect
      ctx.shadowColor = 'transparent';
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, radius);
      ctx.clip();

      const headerOffset = topBar ? 32 : 0;
      if (topBar) {
        ctx.fillStyle = '#141a21';
        ctx.fillRect(-w / 2, -h / 2, w, 32);
        const dots = ['#e05c5c', '#d98a53', '#2d8a5e'];
        dots.forEach((c, idx) => {
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(-w / 2 + 20 + idx * 16, -h / 2 + 16, 4.5, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 11px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('property-visualizer-b04f3.web.app', 0, -h / 2 + 20);
      }

      ctx.drawImage(img, -w / 2, -h / 2 + headerOffset, w, h - headerOffset);
      ctx.restore();

      // Border outline
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(-w / 2, -h / 2, w, h, radius);
      ctx.stroke();

      if (highlightColor) {
        ctx.strokeStyle = highlightColor;
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // ── Tactile Precision Cursor Helper ────────────────────────────────────
    function drawPrecisionCursor(x, y, isPressed = false, rippleP = 0) {
      ctx.save();
      ctx.translate(x, y);

      if (rippleP > 0 && rippleP < 1) {
        const r = rippleP * 54;
        ctx.strokeStyle = `rgba(34, 112, 184, ${1 - rippleP})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      const s = isPressed ? 0.86 : 1.0;
      ctx.scale(s, s);
      ctx.shadowColor = 'rgba(5, 27, 48, 0.45)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 5;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = COLORS.oceanAuthority;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 26);
      ctx.lineTo(7, 19.5);
      ctx.lineTo(14, 29);
      ctx.lineTo(18.5, 26);
      ctx.lineTo(11.5, 16.5);
      ctx.lineTo(19.5, 16.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ── Broadcast Showreel HUD Frame & Audio Beat Visualizer ───────────────
    function drawShowreelHUD(t, actNumber, actTitle, worldMode, isLight = false) {
      ctx.save();
      const pad = 36;
      const bLen = 18;
      const hudColor = isLight ? 'rgba(11, 56, 96, 0.55)' : 'rgba(71, 157, 233, 0.55)';
      const textColor = isLight ? COLORS.oceanAuthority : '#cbd5e1';
      const mutedColor = isLight ? '#64748b' : '#64748b';

      ctx.strokeStyle = hudColor;
      ctx.lineWidth = 1.8;

      // 4 Corner Viewfinder Brackets
      ctx.beginPath();
      ctx.moveTo(pad, pad + bLen); ctx.lineTo(pad, pad); ctx.lineTo(pad + bLen, pad);
      ctx.moveTo(1920 - pad - bLen, pad); ctx.lineTo(1920 - pad, pad); ctx.lineTo(1920 - pad, pad + bLen);
      ctx.moveTo(pad, 1080 - pad - bLen); ctx.lineTo(pad, 1080 - pad); ctx.lineTo(pad + bLen, 1080 - pad);
      ctx.moveTo(1920 - pad - bLen, 1080 - pad); ctx.lineTo(1920 - pad, 1080 - pad); ctx.lineTo(1920 - pad, 1080 - pad - bLen);
      ctx.stroke();

      // Top-Left: Live Brand Pill
      ctx.fillStyle = isLight ? 'rgba(255, 255, 255, 0.90)' : 'rgba(20, 26, 33, 0.90)';
      ctx.strokeStyle = isLight ? 'rgba(228, 228, 231, 0.9)' : 'rgba(38, 47, 56, 0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(pad + 14, pad + 10, 340, 32, 8);
      ctx.fill();
      ctx.stroke();

      // Pulsing beat indicator synced to 128 BPM
      const beatPulse = 1 - ((t / BEAT) % 1);
      ctx.fillStyle = isLight ? COLORS.blueprintCobalt : COLORS.skyFocus;
      ctx.beginPath();
      ctx.arc(pad + 30, pad + 26, 4 + beatPulse * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = textColor;
      ctx.font = '800 11px Manrope';
      ctx.textAlign = 'left';
      ctx.fillText(`PROPVIZ // ${actNumber} • ${actTitle}`, pad + 44, pad + 30);

      // Top-Right: Dual-World Mode + Timecode + 128 BPM Equalizer Bars
      ctx.fillStyle = isLight ? 'rgba(255, 255, 255, 0.90)' : 'rgba(20, 26, 33, 0.90)';
      ctx.beginPath();
      ctx.roundRect(1920 - pad - 390, pad + 10, 376, 32, 8);
      ctx.fill();
      ctx.stroke();

      // Mini 8-bar audio spectrum synced to 128 BPM
      for (let b = 0; b < 8; b++) {
        const barH = 5 + Math.abs(Math.sin(t * 14 + b * 1.1)) * 14 * (0.5 + 0.5 * beatPulse);
        ctx.fillStyle = b % 3 === 0 ? COLORS.occupied : (b % 2 === 0 ? COLORS.skyFocus : COLORS.brandEmerald);
        ctx.fillRect(1920 - pad - 374 + b * 6, pad + 26 - barH / 2, 3.5, barH);
      }

      const barNum = Math.min(16, Math.floor(t / BAR) + 1);
      const frameNum = Math.floor((t % 1) * 30).toString().padStart(2, '0');
      const secStr = Math.floor(t).toString().padStart(2, '0');
      ctx.fillStyle = textColor;
      ctx.font = '700 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`${worldMode}  |  BAR ${String(barNum).padStart(2, '0')}/16  |  00:${secStr}:${frameNum}`, 1920 - pad - 28, pad + 30);

      // Bottom Progress Scrubber Bar
      const progW = 1920 - (pad + 14) * 2;
      const progY = 1080 - pad - 14;
      ctx.fillStyle = isLight ? 'rgba(11, 56, 96, 0.12)' : 'rgba(255, 255, 255, 0.10)';
      ctx.fillRect(pad + 14, progY, progW, 3);

      const fillW = clamp(t / 30.0, 0, 1) * progW;
      const grad = ctx.createLinearGradient(pad + 14, 0, pad + 14 + progW, 0);
      grad.addColorStop(0, COLORS.blueprintCobalt);
      grad.addColorStop(0.5, COLORS.skyFocus);
      grad.addColorStop(1, COLORS.occupied);
      ctx.fillStyle = grad;
      ctx.fillRect(pad + 14, progY, fillW, 3);

      ctx.restore();
    }

    // ═════════════════════════════════════════════════════════════════════════
    // MASTER 30.0-SECOND (16-BAR @ 128 BPM) FRAME RENDERER
    // ═════════════════════════════════════════════════════════════════════════
    window.renderFrame = function(t) {
      ctx.clearRect(0, 0, 1920, 1080);

      // ───────────────────────────────────────────────────────────────────────
      // ACT I: (0.00s – 5.625s | Bars 1–3)
      // SPREADSHEET SHATTER -> MASCOT 3D GENESIS & DESIGN TOKENS
      // VO: "Meet Property Visualizer. The spatial digital twin turning abstract rows into living architecture."
      // ───────────────────────────────────────────────────────────────────────
      if (t < 5.625) {
        // Obsidian Midnight Blueprint Backdrop
        const bgGrad = ctx.createRadialGradient(960, 480, 40, 960, 540, 1180);
        bgGrad.addColorStop(0, '#0c2b4b');
        bgGrad.addColorStop(0.55, '#071729');
        bgGrad.addColorStop(1, '#040911');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1920, 1080);

        drawArchitecturalGrid(t, false, 0.18, 1.3);
        drawParticles(t, 0.9);

        // ── Phase 1A (0.00s – 1.875s | Bar 1): Abstract Spreadsheet Rows Sliced & Shattered ──
        if (t < 2.15) {
          const shatterP = invLerp(1.40, 2.05, t);
          const shatterEase = easeOutExpo(shatterP);
          const alpha1A = 1 - invLerp(1.75, 2.10, t);

          ctx.save();
          ctx.globalAlpha = alpha1A;

          // 8 Floating Spreadsheet Rows in 3D space that split apart at t=1.40s
          const rows = [
            { cell: 'ROW_01 // UNIT_101', tenant: 'ELENA ROSTOVA', status: 'SYNC_ERR_0x44', col: '#94a3b8' },
            { cell: 'ROW_02 // UNIT_102', tenant: 'MARCUS STERLING', status: 'NO_FLOORPLAN', col: '#94a3b8' },
            { cell: 'ROW_03 // UNIT_103', tenant: 'DAVID KIM — ₱2,600', status: '⚠ OVERDUE_LOST', col: '#e05c5c' },
            { cell: 'ROW_04 // UNIT_201', tenant: 'SOPHIA LAURENT', status: 'HVAC_LEAK_UNMAPPED', col: '#d98a53' },
            { cell: 'ROW_05 // UNIT_202', tenant: 'VACANT_INVENTORY', status: '#REF!_STATIC_PDF', col: '#6e8592' },
            { cell: 'ROW_06 // UNIT_301', tenant: 'AMARA CHEN', status: 'UTILITY_SPLIT_ERR', col: '#e05c5c' }
          ];

          rows.forEach((r, idx) => {
            const enterP = easeOutCubic(invLerp(idx * 0.06, idx * 0.06 + 0.35, t));
            const baseY = 250 + idx * 86;
            const isTopHalf = idx < 3;
            const splitX = shatterEase * (isTopHalf ? -480 - idx * 70 : 480 + idx * 70);
            const splitY = shatterEase * (isTopHalf ? -160 : 160);
            const splitRot = shatterEase * (isTopHalf ? -0.18 : 0.18);
            const jitterX = (t > 0.8 && t < 1.4) ? Math.sin(t * 75 + idx) * 4 : 0;

            ctx.save();
            ctx.translate(960 + splitX + jitterX, baseY + splitY);
            ctx.rotate(splitRot);
            ctx.scale(lerp(0.92, 1.0, enterP), lerp(0.92, 1.0, enterP));

            ctx.fillStyle = idx === 2 ? 'rgba(224, 92, 92, 0.18)' : 'rgba(20, 26, 33, 0.88)';
            ctx.strokeStyle = idx === 2 ? COLORS.overdue : 'rgba(71, 157, 233, 0.32)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.roundRect(-520, -32, 1040, 64, 12);
            ctx.fill();
            ctx.stroke();

            ctx.font = '700 14px "JetBrains Mono", monospace';
            ctx.fillStyle = '#e2e8f0';
            ctx.textAlign = 'left';
            ctx.fillText(r.cell, -490, 5);

            ctx.font = '700 15px Manrope';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(r.tenant, -180, 5);

            ctx.font = '800 13px "JetBrains Mono", monospace';
            ctx.fillStyle = r.col;
            ctx.textAlign = 'right';
            ctx.fillText(r.status, 490, 5);

            ctx.restore();
          });

          // Giant kinetic hook banner across center
          const hookScale = easeOutBack(invLerp(0.05, 0.45, t));
          ctx.save();
          ctx.translate(960, 145 - shatterEase * 120);
          ctx.scale(hookScale, hookScale);
          ctx.textAlign = 'center';
          ctx.font = '800 14px Manrope';
          ctx.fillStyle = COLORS.overdue;
          ctx.fillText('✕ THE OLD WAY: STATIC SPREADSHEETS & MENTAL FLOORPLANS', 0, -42);
          ctx.font = '800 54px Sora';
          ctx.fillStyle = '#ffffff';
          ctx.fillText('ABSTRACT ROWS BLIND YOUR PORTFOLIO.', 0, 12);
          ctx.restore();

          // Diagonal Cobalt Laser Slash at t = 1.35s -> 1.85s
          if (t >= 1.32 && t <= 1.90) {
            const slashP = invLerp(1.32, 1.65, t);
            const slashFade = 1 - invLerp(1.65, 1.90, t);
            ctx.save();
            ctx.globalAlpha = slashFade;
            ctx.strokeStyle = '#479de9';
            ctx.shadowColor = '#479de9';
            ctx.shadowBlur = 45;
            ctx.lineWidth = 10;
            ctx.beginPath();
            ctx.moveTo(180, 960);

        // ── 3 Synchronized Tenancy Triad Hologram Reticle Locks (12.65s, 13.59s, 14.53s) ──
        const reticles = [
          {
            t0: 12.65,

        reticles.forEach((ret) => {
          if (t >= ret.t0 && t < 15.55) {

            ctx.save();

            // Target reticle box on 3D unit

            ctx.stroke();

            ctx.fillStyle = ret.color;

        // ── Roof Maintenance Pin & Real Maintenance Screen Callout (15.468s – 16.875s) ──
        if (t >= 15.468) {

          ctx.beginPath();

          ctx.roundRect(900, 265, 460, 38, 10);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 13px Sora';
          ctx.textAlign = 'center';

        // Cyan Laser CAD Scan Wipe at end of Act III (16.50s -> 16.875s)
        if (t >= 16.50) {
          const scanP = invLerp(16.50, 16.875, t);

          ctx.save();
          ctx.strokeStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 45;
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(scanX, 0);
          ctx.lineTo(scanX, 1080);
          ctx.stroke();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';

        drawShowreelHUD(t, 'ACT 03', 'OBSIDIAN 3D SPATIAL ENGINE', 'OBSIDIAN #0B0F13', false);
      }

      // ───────────────────────────────────────────────────────────────────────
      // ACT IV: (16.875s – 22.50s | Bars 10–12)
      // 2D ARCHITECTURAL CAD BLUEPRINT, 60FPS iPAD WEBKIT & 4-SCREEN BENTO GRID
      // VO: "Slide into 2D CAD blueprints with buttery sixty frames per second on your iPad."
      // ───────────────────────────────────────────────────────────────────────
      else if (t < 22.50) {
        ctx.fillStyle = '#07111d';
        ctx.fillRect(0, 0, 1920, 1080);
        drawArchitecturalGrid(t, false, 0.24, 1.4);

        // ── Phase 4A (16.875s – 20.625s | Bars 10–11): iPad Pro 60FPS 2D CAD Blueprint Showcase ──
        if (t < 20.625) {
          const padP = easeOutBack(invLerp(16.875, 17.45, t), 1.25);

          // Sleek iPad Pro Hardware Frame in Center-Left
          ctx.save();
          ctx.translate(780, 535);
          ctx.scale(padP, padP);

          // Outer aluminum/space-gray iPad bezel
          ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
          ctx.shadowBlur = 65;
          ctx.shadowOffsetY = 28;
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(-640, -385, 1280, 770, 38);
          ctx.fill();
          ctx.stroke();
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;

          // Inner iPad black bezel
          ctx.fillStyle = '#05080c';
          ctx.beginPath();
          ctx.roundRect(-616, -361, 1232, 722, 24);
          ctx.fill();

          // Real Floor 1 2D Architectural Blueprint inside iPad screen
          const bpImg = images.blueprintF1 || images.blueprintAll;
          if (bpImg) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(-608, -353, 1216, 706, 18);
            ctx.clip();
            const zoom2D = lerp(1.0, 1.12, easeInOutCubic(invLerp(17.8, 19.8, t)));
            ctx.scale(zoom2D, zoom2D);
            ctx.drawImage(bpImg, -608, -353, 1216, 706);
            ctx.restore();
          }

          // Animated CAD Dimension Calipers over the iPad screen (18.0s+)
          if (t >= 18.0) {
            const calP = easeOutCubic(invLerp(18.0, 18.6, t));
            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.fillStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.font = '700 12px "JetBrains Mono", monospace';

            const lineW = 360 * calP;
            ctx.beginPath();
            ctx.moveTo(-180, -175);
            ctx.lineTo(-180 + lineW, -175);

          ctx.restore();

          // Right Side Telemetry Column: iPad 60FPS Specs + Real Staff & Payroll Card
          const specP = easeOutCubic(invLerp(17.30, 17.90, t));
          ctx.save();
          ctx.globalAlpha = specP;
          ctx.translate(1640, 310);

          ctx.fillStyle = 'rgba(20, 26, 33, 0.95)';
          ctx.strokeStyle = COLORS.brandEmerald;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(-210, -135, 420, 270, 20);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.fillStyle = '#34d399';
          ctx.font = '800 12px Manrope';
          ctx.fillText('⚡ FIELD-READY IPAD WEBKIT ENGINE', -180, -92);

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 44px Sora';
          ctx.fillText('60 FPS LOCK', -180, -38);

          const specs = [
            '✓ Zero GPU Overhead 2D Blueprint Mode',
            '✓ No-Blur Compositing Mandate (DESIGN.md)',
            '✓ 42px Minimum Touch Hit Targets',
            '✓ Instant WebGL 2 Fallback Guarantee'

          ctx.fillStyle = '#cbd5e1';
          specs.forEach((s, i) => {

          // Bottom-Right Floating Preview: Real Staff & Payroll Screen
          if (t >= 18.25) {

            drawFramedScreen(images.staff, 1640, 685, 420, 250, {
              scale: stP,

        }

        // ── Phase 4B (20.625s – 22.50s | Bar 12): 4-Beat Full-Ecosystem Bento Grid Snap ──
        else {
          const bentoCells = [
            { t0: 20.62500, x: 515,  y: 325, img: images.front3d,     tag: '01 // 3D SPATIAL ELEVATION', col: COLORS.skyFocus },

            { t0: 22.03125, x: 1405, y: 755, img: images.staff,       tag: '04 // STAFF & PAYROLL LEDGER', col: COLORS.blueprintCobalt }
          ];

          bentoCells.forEach((cell) => {
            if (t >= cell.t0) {

              ctx.roundRect(0, 0, 285, 34, 8);
              ctx.fill();
              ctx.stroke();
              ctx.fillStyle = '#ffffff';
              ctx.font = '800 11px Sora';
              ctx.textAlign = 'left';
              ctx.fillText(cell.tag, 14, 21);
              ctx.restore();

        drawShowreelHUD(t, 'ACT 04', '2D CAD & FULL ECOSYSTEM BENTO', '60 FPS IPAD PWA', false);
      }

      // ───────────────────────────────────────────────────────────────────────
      // ACT V: (22.50s – 30.00s | Bars 13–16)
      // BEAT-SYNCED KINETIC SHOWREEL MONTAGE & GRAND BRAND HERO FINALE
      // VO 5: "Every tenant. Every floor. Every single dollar. Exactly where it belongs."
      // VO 6: "Command your portfolio with Property Visualizer today."
      // ───────────────────────────────────────────────────────────────────────
      else {
        // ── Phase 5A (22.50s – 26.25s | Bars 13–14): 6 Rapid-Fire Beat-Locked Showreel Cuts ──
        if (t < 26.25) {
          // Cut 1 (22.500s – 23.4375s): "EVERY TENANT." over Units Directory + Terracotta Accent
          if (t < 23.4375) {
            const p = invLerp(22.50, 23.4375, t);

            ctx.translate(960, 540);
            ctx.scale(pop, pop);
            ctx.fillStyle = COLORS.occupied;
            ctx.beginPath();
            ctx.roundRect(-240, -155, 480, 44, 22);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 14px Manrope';
            ctx.textAlign = 'center';

            ctx.font = '800 118px Sora';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';

            ctx.restore();
          }

          // Cut 2 (23.4375s – 24.375s): "EVERY FLOOR." over Top-Down 3D + Cinematic 3D Split
          else if (t < 24.375) {
            const p = invLerp(23.4375, 24.375, t);
            ctx.fillStyle = COLORS.obsidianDark;

            if (images.top3d) {
              ctx.save();
              ctx.globalAlpha = 0.55;
              const s = lerp(1.02, 1.14, p);
              ctx.translate(960, 540);
              ctx.scale(s, s);
              ctx.drawImage(images.top3d, -960, -540, 1920, 1080);
              ctx.restore();
            }

            const pop = easeOutBack(invLerp(23.4375, 23.70, t), 1.6);
            ctx.save();
            ctx.translate(960, 540);
            ctx.scale(pop, pop);
            ctx.fillStyle = COLORS.blueprintCobalt;
            ctx.beginPath();
            ctx.roundRect(-220, -155, 440, 44, 22);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 14px Manrope';
            ctx.textAlign = 'center';
            ctx.fillText('THREE.JS r185 // F1 • F2 • F3 ISOLATOR', 0, -128);

            ctx.font = '800 118px Sora';
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = COLORS.skyFocus;
            ctx.shadowBlur = 50;
            ctx.fillText('EVERY FLOOR.', 0, 30);
            ctx.restore();
          }

          // Cut 3 (24.375s – 24.84375s | 1 Beat): "EVERY" (Daylight Mist Flash)
          else if (t < 24.84375) {
            ctx.fillStyle = COLORS.surfaceCanvas;
            ctx.fillRect(0, 0, 1920, 1080);
            drawFramedScreen(images.dashboard, 960, 540, 1600, 900, { scale: 1.15, alpha: 0.22 });
            ctx.save();
            ctx.translate(960, 560);
            ctx.fillStyle = COLORS.oceanAuthority;
            ctx.font = '800 142px Sora';
            ctx.textAlign = 'center';
            ctx.fillText('EVERY', 0, 0);
            ctx.restore();
          }

          // Cut 4 (24.84375s – 25.3125s | 1 Beat): "SINGLE DOLLAR." (Emerald Revenue Flash)
          else if (t < 25.3125) {
            ctx.fillStyle = '#06281e';
            ctx.fillRect(0, 0, 1920, 1080);
            drawFramedScreen(images.unitModal, 960, 540, 1600, 900, { scale: 1.12, alpha: 0.30 });
            ctx.save();
            ctx.translate(960, 555);
            ctx.fillStyle = '#34d399';
            ctx.font = '800 116px Sora';
            ctx.textAlign = 'center';
            ctx.fillText('SINGLE DOLLAR.', 0, 0);
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 26px Sora';
            ctx.fillText('₱34,250 / MO VERIFIED CASH FLOW & RECEIPTS', 0, 65);
            ctx.restore();
          }

          // Cut 5 (25.3125s – 25.78125s | 1 Beat): "EXACTLY WHERE" (Blueprint Cobalt Flash)
          else if (t < 25.78125) {
            ctx.fillStyle = COLORS.blueprintCobalt;
            ctx.fillRect(0, 0, 1920, 1080);
            drawFramedScreen(images.blueprintF1, 960, 540, 1500, 840, { scale: 1.08, alpha: 0.28 });
            ctx.save();
            ctx.translate(960, 560);
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 108px Sora';
            ctx.textAlign = 'center';
            ctx.fillText('EXACTLY WHERE', 0, 0);
            ctx.restore();
          }

          // Cut 6 (25.78125s – 26.25s | 1 Beat): "IT BELONGS." (Obsidian + Pixel Blueprint Icon)
          else {
            ctx.fillStyle = COLORS.obsidianDark;
            ctx.fillRect(0, 0, 1920, 1080);
            if (images.faviconHires) {
              ctx.save();
              ctx.globalAlpha = 0.22;
              ctx.drawImage(images.faviconHires, 560, 140, 800, 800);
              ctx.restore();
            }
            ctx.save();
            ctx.translate(960, 560);
            ctx.fillStyle = COLORS.occupied;
            ctx.font = '800 124px Sora';
            ctx.textAlign = 'center';
            ctx.fillText('IT BELONGS.', 0, 0);
            ctx.restore();
          }
        }

        // ── Phase 5B (26.25s – 30.00s | Bars 15–16): GRAND ARCHITECTURAL BRAND FINALE ──
        else {
          const finT = t - 26.25;

          // Deep Dual-World Horizon Backdrop
          const finGrad = ctx.createRadialGradient(960, 420, 50, 960, 540, 1250);
          finGrad.addColorStop(0, '#0f3861');
          finGrad.addColorStop(0.5, '#07192e');
          finGrad.addColorStop(1, '#03070c');
          ctx.fillStyle = finGrad;
          ctx.fillRect(0, 0, 1920, 1080);

          drawArchitecturalGrid(t, false, 0.20, 0.7);
          drawParticles(t, 1.0);

          // 2 Background Floating 3D & Dashboard Wings in Soft Parallax
          const wingP = easeOutCubic(invLerp(26.25, 27.10, t));
          drawFramedScreen(images.dashboard, lerp(500, 260, wingP), 530, 640, 360, {
            scale: 0.85,
            rot: -0.06,
            alpha: 0.42 * wingP,
            borderColor: COLORS.skyFocus
          });
          drawFramedScreen(images.spatial3d, lerp(1420, 1660, wingP), 530, 640, 360, {
            scale: 0.85,
            rot: 0.06,
            alpha: 0.48 * wingP,
            borderColor: COLORS.occupied
          });

          // Center Mascot Building Icon with Volumetric Halo
          const heroPop = easeOutBack(invLerp(26.25, 26.85, t), 1.7);
          const mascotImg = images.iconClean || images.icon;
          if (mascotImg) {
            ctx.save();
            ctx.translate(960, 290 + Math.sin(t * 3) * 5);
            ctx.scale(heroPop, heroPop);
            ctx.shadowColor = COLORS.skyFocus;
            ctx.shadowBlur = 55;
            ctx.drawImage(mascotImg, -105, -120, 210, 238);
            ctx.restore();
          }

          // Official Horizontal Brand Card Pill
          ctx.save();
          ctx.translate(960, 535);
          ctx.scale(heroPop, heroPop);
          ctx.textAlign = 'center';

          ctx.font = '800 74px Sora';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(71, 157, 233, 0.65)';
          ctx.shadowBlur = 40;
          ctx.fillText('PROPERTY VISUALIZER', 0, 0);

          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#34d399';
          ctx.font = '800 18px Manrope';
          ctx.letterSpacing = '0.16em';
          ctx.fillText('THE ARCHITECTURAL CONTROL DECK  •  3D & 2D DIGITAL TWIN', 0, 42);

          // Live URL CTA Button
          ctx.fillStyle = COLORS.oceanAuthority;
          ctx.strokeStyle = COLORS.skyFocus;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(-310, 74, 620, 60, 30);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 22px Sora';
          ctx.letterSpacing = '0px';
          ctx.fillText('property-visualizer-b04f3.web.app', 0, 112);

          // Tenancy Triad + Stack Footer
          ctx.fillStyle = '#94a3b8';
          ctx.font = '700 13px "JetBrains Mono", monospace';
          ctx.fillText('NEXT.JS 16  •  REACT 19  •  THREE.JS r185  •  TAILWIND CSS v4  •  FIREBASE', 0, 178);
          ctx.restore();

          // Smooth Final Fade Out (29.55s -> 30.00s)
          if (t >= 29.55) {
            const fadeOut = invLerp(29.55, 30.00, t);
            ctx.fillStyle = `rgba(0, 0, 0, ${fadeOut})`;
            ctx.fillRect(0, 0, 1920, 1080);
          }
        }

        drawShowreelHUD(t, 'ACT 05', 'SPATIAL TRUTH OVER SPREADSHEETS', 'PROPVIZ SHOWREEL', false);
      }
    };

    window.preloadAll = preloadAll;
